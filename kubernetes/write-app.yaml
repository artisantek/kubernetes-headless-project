apiVersion: apps/v1
kind: Deployment
metadata:
  name: write-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: write-app
  template:
    metadata:
      labels:
        app: write-app
    spec:
      initContainers:
      - name: wait-for-db
        image: postgres:15
        command:
        - bash
        - -c
        - |
          echo "Waiting for PostgreSQL primary to be ready..."
          until pg_isready -h postgres-0.postgres -U postgres; do
            sleep 2
          done
          echo "PostgreSQL is ready."
        env:
        - name: PGPASSWORD
          value: "postgres"
      containers:
      - name: write-app
        image: artisantek/headless-write:2
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: "postgres-0.postgres"
        - name: DB_USER
          value: "appuser"
        - name: DB_PASSWORD
          value: "password123"
        - name: DB_NAME
          value: "userdb"
---
apiVersion: v1
kind: Service
metadata:
  name: write-app-service
spec:
  type: NodePort
  selector:
    app: write-app
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30000